# Purpose: Runs the latest CDNgine portable Docker instance directly from the GitHub repository without requiring a local checkout.
# Governing docs:
# - README.md
# - deploy/local-platform/README.md
# - docs/environment-and-deployment.md
# - docs/service-architecture.md
# External references:
# - https://docs.docker.com/reference/cli/docker/compose/
# - https://docs.docker.com/reference/compose-file/build/
# - https://docs.docker.com/build/building/context/
# Tests:
# - scripts/docker-instance.test.mjs

name: cdngine-latest

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  cdngine-db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: temporal
    entrypoint:
      - /bin/sh
      - -ec
      - |
        psql -h postgres -U temporal -d temporal -tc "SELECT 1 FROM pg_roles WHERE rolname = 'cdngine'" | grep -q 1 || psql -h postgres -U temporal -d temporal -c "CREATE USER cdngine WITH PASSWORD 'cdngine'"
        psql -h postgres -U temporal -d temporal -tc "SELECT 1 FROM pg_database WHERE datname = 'cdngine'" | grep -q 1 || psql -h postgres -U temporal -d temporal -c "CREATE DATABASE cdngine OWNER cdngine"
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "${TEMPORAL_UI_PORT:-8080}:8080"

  rustfs-perms:
    image: alpine:3.21
    user: root
    volumes:
      - rustfs-data:/fix_path
    command: ["/bin/sh", "-ec", "chown -R 10001:10001 /fix_path"]
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    command:
      - /data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  rustfs-init:
    image: public.ecr.aws/aws-cli/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
      STAGING_BUCKET: ${STAGING_BUCKET:-cdngine-staging}
      SOURCE_BUCKET: ${SOURCE_BUCKET:-cdngine-source}
      DERIVED_BUCKET: ${DERIVED_BUCKET:-cdngine-derived}
      EXPORTS_BUCKET: ${EXPORTS_BUCKET:-cdngine-exports}
      KOPIA_BUCKET: ${KOPIA_BUCKET:-cdngine-kopia}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until aws --endpoint-url http://rustfs:9000 s3api list-buckets >/dev/null 2>&1; do
          sleep 2
        done
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$STAGING_BUCKET" >/dev/null 2>&1 || true
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$SOURCE_BUCKET" >/dev/null 2>&1 || true
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$DERIVED_BUCKET" >/dev/null 2>&1 || true
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$EXPORTS_BUCKET" >/dev/null 2>&1 || true
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$KOPIA_BUCKET" >/dev/null 2>&1 || true
    restart: "no"

  tusd:
    image: tusproject/tusd:latest
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    command:
      - -host=0.0.0.0
      - -port=1080
      - -base-path=/files/
      - -behind-proxy
      - -s3-bucket=${STAGING_BUCKET:-cdngine-staging}
      - -s3-endpoint=http://rustfs:9000
      - -s3-object-prefix=${TUSD_OBJECT_PREFIX:-uploads/}
    ports:
      - "${TUSD_PORT:-1080}:1080"

  kopia-init:
    image: kopia/kopia:latest
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    environment:
      KOPIA_PASSWORD: ${KOPIA_REPOSITORY_PASSWORD:-cdngine-local-repository}
      KOPIA_BUCKET: ${KOPIA_BUCKET:-cdngine-kopia}
      KOPIA_REPOSITORY_PREFIX: ${KOPIA_REPOSITORY_PREFIX:-source/}
      KOPIA_S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      KOPIA_S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - kopia-config:/app/config
      - kopia-cache:/app/cache
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if kopia repository connect s3 \
          --bucket="$$KOPIA_BUCKET" \
          --access-key="$$KOPIA_S3_ACCESS_KEY" \
          --secret-access-key="$$KOPIA_S3_SECRET_KEY" \
          --endpoint=rustfs:9000 \
          --disable-tls \
          --region="$$AWS_REGION" \
          --prefix="$$KOPIA_REPOSITORY_PREFIX"; then
          echo "Connected to existing Kopia repository."
        else
          echo "Creating a fresh Kopia repository in RustFS."
          kopia repository create s3 \
            --bucket="$$KOPIA_BUCKET" \
            --access-key="$$KOPIA_S3_ACCESS_KEY" \
            --secret-access-key="$$KOPIA_S3_SECRET_KEY" \
            --endpoint=rustfs:9000 \
            --disable-tls \
            --region="$$AWS_REGION" \
            --prefix="$$KOPIA_REPOSITORY_PREFIX"
        fi
    restart: "no"

  kopia:
    image: kopia/kopia:latest
    depends_on:
      kopia-init:
        condition: service_completed_successfully
    environment:
      KOPIA_PASSWORD: ${KOPIA_REPOSITORY_PASSWORD:-cdngine-local-repository}
    volumes:
      - kopia-config:/app/config
      - kopia-cache:/app/cache
    command:
      - server
      - start
      - --insecure
      - --without-password
      - --address=0.0.0.0:51515
    ports:
      - "${KOPIA_PORT:-51515}:51515"

  registry:
    image: registry:2
    ports:
      - "${OCI_REGISTRY_PORT:-5000}:5000"
    volumes:
      - registry-data:/var/lib/registry

  cdngine-runtime:
    build:
      context: https://github.com/Yeusepe/cdngine.git#main
      dockerfile: Dockerfile
    image: cdngine-latest-instance:latest
    command: ["npm", "run", "runtime:start", "--workspace", "@cdngine/demo"]
    depends_on:
      cdngine-db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully
      tusd:
        condition: service_started
      kopia:
        condition: service_started
      registry:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      CDNGINE_DATABASE_URL: postgresql://cdngine:cdngine@postgres:5432/cdngine
      CDNGINE_PUBLIC_RUNTIME_STATE_DIR: /var/lib/cdngine/public-runtime
      CDNGINE_PUBLIC_RUNTIME_STORAGE: object-store
      CDNGINE_S3_FORCE_PATH_STYLE: "true"
      OCI_REGISTRY_URL: http://registry:5000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      STAGING_BUCKET: ${STAGING_BUCKET:-cdngine-staging}
      TEMPORAL_ADDRESS: temporal:7233
      TUSD_ENDPOINT: http://tusd:1080/files/
      TUSD_OBJECT_PREFIX: ${TUSD_OBJECT_PREFIX:-uploads/}
    ports:
      - "${CDNGINE_PUBLIC_RUNTIME_PORT:-4000}:4000"
    restart: unless-stopped
    volumes:
      - cdngine-public-runtime:/var/lib/cdngine/public-runtime

  cdngine-demo:
    image: cdngine-latest-instance:latest
    command: ["npm", "run", "ui:start", "--workspace", "@cdngine/demo"]
    depends_on:
      cdngine-runtime:
        condition: service_started
    environment:
      CDNGINE_PUBLIC_RUNTIME_PROXY: http://cdngine-runtime:4000
    ports:
      - "${CDNGINE_DEMO_PORT:-5173}:5173"
    profiles:
      - demo
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
  registry-data:
  kopia-config:
  kopia-cache:
  cdngine-public-runtime:
